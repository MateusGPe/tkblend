name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # macos-14 runner is ARM64 and only supports Python >= 3.10
          - os: macos-14
            python-version: "3.9"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux build & display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl8.6-dev tk8.6-dev xvfb libx11-dev

      - name: Install build tools & dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cmake ninja nanobind scikit-build-core pytest

      - name: Build and install tkblend (editable/dev)
        run: |
          python -m pip install -e . --no-build-isolation -v

      - name: Run tests (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pytest -v

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          pytest -v

  sanitizers:
    name: ASan & UBSan (Linux - Py 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux build & display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl8.6-dev tk8.6-dev xvfb libx11-dev libasan8

      - name: Install build tools & test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cmake ninja nanobind scikit-build-core pytest

      - name: Run ASan & UBSan Sanitizer Test Suite
        run: |
          ./scripts/run_sanitizers.sh

  coverage:
    name: Dual Code Coverage (Python + C++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux build & display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl8.6-dev tk8.6-dev xvfb libx11-dev gcovr

      - name: Install build tools & coverage dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cmake ninja nanobind scikit-build-core pytest pytest-cov coverage gcovr

      - name: Run Dual Coverage Suite (Python + C++)
        run: |
          ./scripts/run_coverage.sh

      - name: Upload Python Coverage HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-report
          path: build/coverage/python_html/

      - name: Upload C++ Coverage HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-coverage-report
          path: build/coverage/cpp_html/
