[build-system]
requires = ["scikit-build-core>=0.9.0", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tkblend"
version = "0.2.0"
description = "High-performance Blend2D vector graphics addon for ttkbootstrap and Tkinter via zero-copy Tk_PhotoPutBlock blitting"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "tkblend authors" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.optional-dependencies]
ttkbootstrap = [
    "ttkbootstrap>=1.10.0",
]
autotheme = [
    "darkdetect>=0.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.0.0",
    "gcovr>=7.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "cibuildwheel>=2.19.0",
    "ttkbootstrap>=1.10.0",
    "darkdetect>=0.8.0",
]


[tool.scikit-build]
cmake.version = ">=3.20"
ninja.make-fallback = true
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "slow: heavy-stress tests (500-1000 iterations). Run with: pytest -m slow",
]

[tool.coverage.run]
source = ["tkblend"]
omit = [
    "tests/*",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

# ------------------------------------------------------------------------------
# cibuildwheel Configuration
# ------------------------------------------------------------------------------
[tool.cibuildwheel]
# Build CPython 3.9 through 3.13
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *musllinux* cp36-* cp37-* cp38-*"

[tool.cibuildwheel.linux]
# Install Tk/Tcl development libraries for Linux
before-all = [
    "yum update && yum install -y tcl tcl-devel tk tk-devel",
]
# Setup display dependencies before tests
before-test = "xvfb-run -a"
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# Testing configuration (applies to all platforms)
test-requires = ["pytest"]
test-command = "pytest {project}/tests"
test-command-linux = "xvfb-run -a pytest {project}/tests"
test-command-macos = "pytest {project}/tests"
test-command-windows = "pytest {project}/tests"
